name: Conectar WhatsApp na nuvem
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Enviar uma mensagem técnica de teste ao grupo configurado (não é oferta)
        type: boolean
        default: false
      send_preview:
        description: Enviar uma prévia única de produto real sem afirmar desconto
        type: boolean
        default: false
      verify_only:
        description: Verificar sessão e grupo sem QR nem envio de mensagem
        type: boolean
        default: false
      send_media_test:
        description: Enviar o único teste com foto explicitamente autorizado
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: promos-gamer-production
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      SEND_TEST: ${{ inputs.send_test }}
      SEND_PREVIEW: ${{ inputs.send_preview }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      SEND_MEDIA_TEST: ${{ inputs.send_media_test }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preservar continuação do monitor após a conexão
        env:
          PROMOS_CHAIN_ENABLED: ${{ vars.PROMOS_CHAIN_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          PROMOS_PRODUCT_LIMIT: ${{ vars.PROMOS_PRODUCT_LIMIT }}
        run: python3 scripts/continue_monitor.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Usar navegador instalado no runner
        run: python3 scripts/setup_runner_browser.py
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Conectar e salvar sessão (teste de envio opcional)
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          WHATSAPP_SESSION_KEY: ${{ secrets.WHATSAPP_SESSION_KEY }}
          PROMOS_SETTINGS_JSON: ${{ secrets.PROMOS_SETTINGS_JSON }}
          PROMOS_PRODUCTS_JSON: ${{ secrets.PROMOS_PRODUCTS_JSON }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            python -m services.public_job verify
          elif [ "$SEND_MEDIA_TEST" = "true" ]; then
            python -m services.public_job connect --media-test
          elif [ "$SEND_PREVIEW" = "true" ]; then
            python -m services.public_job connect --preview
          elif [ "$SEND_TEST" = "true" ]; then
            python -m services.public_job connect --test
          else
            python -m services.public_job connect
          fi
      # QR e sessão nunca são impressos nem publicados como artifacts.
