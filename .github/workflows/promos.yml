name: Promos Gamer

on:
  schedule:
    # O GitHub executa este workflow a cada cinco minutos. O filtro de
    # concorrência abaixo impede sobreposição caso o runner esteja atrasado.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Enviar ofertas aprovadas ao WhatsApp
        type: boolean
        default: false
      limit:
        description: Limite de produtos descobertos neste ciclo (1 a 500)
        type: number
        default: 20
      source:
        description: Origem do disparo
        type: choice
        options:
          - manual
          - supabase_cron
          - self_chain
        default: manual
      not_before:
        description: Horário mínimo da rodada automática (epoch UTC; uso interno)
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: promos-gamer-production
  cancel-in-progress: false

jobs:
  monitor:
    # Habilitar somente depois de configurar Supabase e secrets.
    if: ${{ vars.PROMOS_CLOUD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      SHOULD_PUBLISH: ${{ vars.ENABLE_WHATSAPP_PUBLISH == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || github.event_name == 'schedule') }}
      PRODUCT_LIMIT: ${{ inputs.limit || 20 }}
      MONITOR_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source == 'self_chain' && 'self_chain' || inputs.source == 'supabase_cron' && 'supabase_cron' || github.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Usar navegador instalado no runner
        run: python3 scripts/setup_runner_browser.py
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Executar um ciclo e persistir estado
        shell: bash
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          PROMOS_SETTINGS_JSON: ${{ secrets.PROMOS_SETTINGS_JSON }}
          PROMOS_PRODUCTS_JSON: ${{ secrets.PROMOS_PRODUCTS_JSON }}
          PROMOS_MINIMUM_DISCOUNT: ${{ vars.PROMOS_MINIMUM_DISCOUNT }}
          WHATSAPP_BRIDGE_URL: ${{ secrets.WHATSAPP_BRIDGE_URL }}
          WHATSAPP_BRIDGE_TOKEN: ${{ secrets.WHATSAPP_BRIDGE_TOKEN }}
          WHATSAPP_SESSION_KEY: ${{ secrets.WHATSAPP_SESSION_KEY }}
        run: |
          python -m services.public_job collect --limit "$PRODUCT_LIMIT"
          if [ "$SHOULD_PUBLISH" = "true" ] && [ "$(cat reports/has_candidates.txt)" = "true" ]; then
            python -m services.public_job publish --limit "$PRODUCT_LIMIT"
          else
            echo "Nenhuma oferta aprovada para publicação; WhatsApp não iniciado."
          fi
      # Não publica banco, sessão do WhatsApp ou relatórios como artifacts.
      # Estado durável e reservas de envio ficam no Supabase privado.
